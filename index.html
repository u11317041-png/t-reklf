<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>在一起一個月啦</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;600&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                        sans: ['"Outfit"', 'sans-serif'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'spin-slow': 'spin 12s linear infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Outfit', 'Noto Serif TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .glass-pill {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .photo-container {
            perspective: 1000px;
        }

        .photo-card {
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .photo-card.hidden-card {
            opacity: 0;
            transform: scale(0.92) translateY(20px);
            pointer-events: none;
        }

        .photo-card.active-card {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0);
            animation: ripple-anim 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple-anim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen h-full overflow-hidden flex flex-col justify-between relative selection:bg-rose-500 selection:text-white">

    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-rose-600/20 rounded-full blur-3xl animate-pulse-slow"></div>
        <div class="absolute top-1/2 -right-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl animate-pulse-slow" style="animation-delay: 1.5s;"></div>
        <div class="absolute -bottom-40 left-1/3 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl animate-pulse-slow" style="animation-delay: 3s;"></div>
    </div>

    <div id="startModal" class="fixed inset-0 z-50 flex flex-col items-center justify-center p-6 bg-slate-950/90 backdrop-blur-xl transition-opacity duration-700">
        <div class="text-center space-y-8 max-w-xs animate-float flex flex-col items-center">
            <!-- Music / Heart Icon -->
            <div class="relative inline-block">
                <div class="w-24 h-24 rounded-full bg-gradient-to-tr from-rose-500 to-indigo-600 p-0.5 shadow-2xl shadow-rose-500/30 flex items-center justify-center mx-auto">
                    <div class="w-full h-full bg-slate-950 rounded-full flex items-center justify-center">
                        <i class="fa-solid fa-heart text-3xl bg-gradient-to-r from-rose-400 to-indigo-300 bg-clip-text text-transparent"></i>
                    </div>
                </div>
                <div class="absolute -top-1 -right-1 w-6 h-6 bg-rose-500 rounded-full flex items-center justify-center text-xs animate-ping"></div>
            </div>

            <div class="space-y-2">
                <h1 class="text-3xl font-serif font-medium tracking-wide text-white">在一起一個月啦</h1>
            </div>

            <!-- Start Touch Button (Icon only, no text) -->
            <button id="btnStart" onclick="startExperience()" aria-label="Start Experience" class="w-20 h-20 rounded-full bg-gradient-to-r from-rose-500 via-purple-500 to-indigo-600 text-white font-medium text-xl shadow-xl shadow-rose-500/30 hover:scale-105 active:scale-95 transition-all duration-300 flex items-center justify-center">
                <i class="fa-solid fa-play ml-1 text-2xl"></i>
            </button>
        </div>
    </div>

    <header class="relative z-10 px-6 pt-6 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <span class="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span>
            <span class="text-xs tracking-widest text-slate-300 uppercase font-medium">Memory Moment</span>
        </div>
        <!-- Photo Counter Badge -->
        <div id="photoBadge" class="glass-pill px-3 py-1 rounded-full text-xs font-mono text-rose-300 border border-rose-500/30 flex items-center space-x-1 transition-all duration-300">
            <i class="fa-regular fa-image text-xs"></i>
            <span id="counterText">1 / 2</span>
        </div>
    </header>

    <main class="relative z-10 flex-1 flex flex-col items-center justify-center p-4 my-auto select-none" id="touchArea" onclick="handleTap(event)">
        
        <!-- Photo Stack Display -->
        <div class="photo-container relative w-full max-w-sm aspect-[4/5] sm:aspect-[3/4] rounded-3xl p-1">
            
            <!-- PHOTO 1 CARD -->
            <div id="photoCard1" class="photo-card active-card absolute inset-0 w-full h-full rounded-3xl overflow-hidden glass-card shadow-2xl border border-white/20 flex flex-col">
                <div class="relative w-full h-full overflow-hidden group">
                    <img id="img1" src="圖片一.jpg" 
                         alt="圖片一" 
                         class="w-full h-full object-contain bg-slate-900/50 transition-transform duration-1000"
                         onerror="this.onerror=null; this.src='圖片一_2.jpg';" />
                </div>
            </div>

            <!-- PHOTO 2 CARD -->
            <div id="photoCard2" class="photo-card hidden-card absolute inset-0 w-full h-full rounded-3xl overflow-hidden glass-card shadow-2xl border border-white/20 flex flex-col">
                <div class="relative w-full h-full overflow-hidden group">
                    <img id="img2" src="圖片二.jpg" 
                         alt="圖片二" 
                         class="w-full h-full object-contain bg-slate-900/50 transition-transform duration-1000"
                         onerror="this.onerror=null; this.src='圖片二_2.jpg';" />
                </div>
            </div>

        </div>

        <!-- Tap Hint Prompt -->
        <div class="mt-5 flex items-center space-x-2 text-slate-400 text-xs animate-bounce">
            <i class="fa-solid fa-hand-pointer text-rose-400 text-sm"></i>
            <span id="tapHintText">點擊螢幕切換照片</span>
        </div>
    </main>

    <footer class="relative z-20 px-4 pb-6 pt-2 max-w-sm mx-auto w-full">
        <div class="glass-pill rounded-2xl p-3.5 flex items-center justify-between shadow-xl border border-white/10">
            
            <!-- Song Info & Rotating Vinyl Disc -->
            <div class="flex items-center space-x-3 overflow-hidden">
                <div id="vinylDisc" class="w-10 h-10 rounded-full bg-slate-900 border border-slate-700 flex items-center justify-center relative flex-shrink-0 animate-spin-slow">
                    <div class="w-3 h-3 rounded-full bg-rose-500"></div>
                </div>
                <div class="overflow-hidden">
                    <div class="text-xs font-semibold text-white truncate" id="songTitle">背景音樂</div>
                    <div class="text-[10px] text-slate-400 truncate" id="songArtist">在一起一個月啦</div>
                </div>
            </div>

            <!-- Music Controls -->
            <div class="flex items-center space-x-2 flex-shrink-0">
                <!-- Mute Button -->
                <button onclick="toggleMute(event)" id="btnMute" aria-label="Toggle Mute" class="w-9 h-9 rounded-full bg-slate-800/80 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition active:scale-90">
                    <i id="muteIcon" class="fa-solid fa-volume-high text-xs"></i>
                </button>

                <!-- Play/Pause Button -->
                <button onclick="togglePlay(event)" id="btnPlayPause" aria-label="Toggle Play Pause" class="w-10 h-10 rounded-full bg-gradient-to-r from-rose-500 to-indigo-600 text-white flex items-center justify-center shadow-md active:scale-90 transition">
                    <i id="playIcon" class="fa-solid fa-pause text-sm"></i>
                </button>
            </div>
        </div>
    </footer>

    <audio id="bgMusic" loop preload="auto">
        <source src="音樂.mp3" type="audio/mpeg">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <script>
        let currentPhotoIndex = 1;
        const totalPhotos = 2;
        let isPlaying = false;
        let isMuted = false;

        const audio = document.getElementById('bgMusic');
        const startModal = document.getElementById('startModal');
        const photoCard1 = document.getElementById('photoCard1');
        const photoCard2 = document.getElementById('photoCard2');
        const counterText = document.getElementById('counterText');
        const playIcon = document.getElementById('playIcon');
        const muteIcon = document.getElementById('muteIcon');
        const vinylDisc = document.getElementById('vinylDisc');

        audio.volume = 0.8;

        function startExperience() {
            startModal.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                startModal.style.display = 'none';
            }, 700);

            playAudio();
        }

        function playAudio() {
            audio.play().then(() => {
                isPlaying = true;
                updateMusicUI();
            }).catch(err => {
                console.log("Audio play deferred or blocked:", err);
                isPlaying = false;
                updateMusicUI();
            });
        }

        function togglePlay(event) {
            if (event) event.stopPropagation();
            
            if (audio.paused) {
                audio.play();
                isPlaying = true;
            } else {
                audio.pause();
                isPlaying = false;
            }
            updateMusicUI();
        }

        function toggleMute(event) {
            if (event) event.stopPropagation();
            
            isMuted = !isMuted;
            audio.muted = isMuted;
            
            if (isMuted) {
                muteIcon.className = 'fa-solid fa-volume-xmark text-xs text-rose-400';
            } else {
                muteIcon.className = 'fa-solid fa-volume-high text-xs';
            }
        }

        function updateMusicUI() {
            if (isPlaying && !audio.paused) {
                playIcon.className = 'fa-solid fa-pause text-sm';
                vinylDisc.style.animationPlayState = 'running';
            } else {
                playIcon.className = 'fa-solid fa-play text-sm ml-0.5';
                vinylDisc.style.animationPlayState = 'paused';
            }
        }

        function handleTap(e) {
            createRipple(e);

            if (currentPhotoIndex === 1) {
                currentPhotoIndex = 2;
                photoCard1.classList.remove('active-card');
                photoCard1.classList.add('hidden-card');

                photoCard2.classList.remove('hidden-card');
                photoCard2.classList.add('active-card');
            } else {
                currentPhotoIndex = 1;
                photoCard2.classList.remove('active-card');
                photoCard2.classList.add('hidden-card');

                photoCard1.classList.remove('hidden-card');
                photoCard1.classList.add('active-card');
            }

            counterText.innerText = `${currentPhotoIndex} / ${totalPhotos}`;
        }

        function createRipple(event) {
            const touchArea = document.getElementById('touchArea');
            const rect = touchArea.getBoundingClientRect();
            
            const circle = document.createElement('span');
            const diameter = Math.max(rect.width, rect.height) / 3;
            const radius = diameter / 2;

            const clientX = event.clientX || (event.touches && event.touches[0].clientX) || rect.width / 2;
            const clientY = event.clientY || (event.touches && event.touches[0].clientY) || rect.height / 2;

            circle.style.width = circle.style.height = `${diameter}px`;
            circle.style.left = `${clientX - rect.left - radius}px`;
            circle.style.top = `${clientY - rect.top - radius}px`;
            circle.classList.add('ripple');

            const existingRipple = touchArea.getElementsByClassName('ripple')[0];
            if (existingRipple) {
                existingRipple.remove();
            }

            touchArea.appendChild(circle);
            setTimeout(() => circle.remove(), 600);
        }

        audio.addEventListener('ended', () => {
            audio.currentTime = 0;
            audio.play();
        });
    </script>
</body>
</html>
